name: Secret Scan
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
permissions:
  contents: read
  pull-requests: write
env:
  GITLEAKS_VERSION: "8.30.0"
jobs:
  secret-scan:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    steps:  
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch full history for gitleaks scanning
      - name: Install Gitleaks
        run: |
          wget -qO- "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Run Gitleaks scan
        id: gitleaks
        run: |
          gitleaks dir . \
            --config .gitleaks.toml \
            --report-format json \
            --report-path gitleaks-report.json \
            --verbose \
            --exit-code 0
 
          
          if [ -s gitleaks-report.json ] && [ "$(cat gitleaks-report.json)" != "[]" ]; then
            echo "leaks_found=true" >> "$GITHUB_OUTPUT"
          else
            echo "leaks_found=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Post PR comment with findings
        if: steps.gitleaks.outputs.leaks_found == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('gitleaks-report.json', 'utf8'));
 
            // group by file so the comment is easier to read
            const byFile = {};
            for (const finding of report) {
              const file = finding.File || 'unknown';
              if (!byFile[file]) byFile[file] = [];
              byFile[file].push(finding);
            }
 
            let body = `## Secret Scan Failed\n\n`;
            body += `Gitleaks found **${report.length} secret(s)** in this PR.\n`;
            body += `Merge is blocked until these are removed.\n\n`;
 
            for (const [file, findings] of Object.entries(byFile)) {
              body += `### \`${file}\`\n\n`;
              body += `| # | Rule | Line | Match (redacted) |\n`;
              body += `|---|------|------|------------------|\n`;
              findings.forEach((f, i) => {
                const rule = f.RuleID || 'unknown';
                const line = f.StartLine || '-';
                const match = f.Match
                  ? f.Match.substring(0, 20) + (f.Match.length > 20 ? '...' : '')
                  : '-';
                body += `| ${i + 1} | \`${rule}\` | ${line} | \`${match}\` |\n`;
              });
              body += `\n`;
            }
 
            body += `### How to fix\n\n`;
            body += `1. Remove the hardcoded secrets from the files above.\n`;
            body += `2. Use environment variables instead, e.g.:\n`;
            body += `   \`\`\`js\n`;
            body += `   // before\n`;
            body += `   const API_KEY = "AKIAIOSFODNN7EXAMPLE";\n`;
            body += `   // after\n`;
            body += `   const API_KEY = process.env.AWS_ACCESS_KEY_ID;\n`;
            body += `   \`\`\`\n`;
            body += `3. Rotate any secrets that were exposed -- treat them as compromised.\n`;
            body += `4. Clean git history with [BFG Repo-Cleaner](https://rtyley.github.io/bfg-repo-cleaner/) or \`git filter-branch\`.\n`;
            body += `5. Push the fix and this check will re-run.\n`;
 
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });

      - name: Fail if secrets detected
        if: steps.gitleaks.outputs.leaks_found == 'true'
        run: exit 1
        